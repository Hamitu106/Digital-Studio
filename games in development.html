<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Studio - بازی های درحال ساخت</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#02030a;
    color:white;
    font-family:Arial,Tahoma,sans-serif;
    overflow-x:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 8%,
            rgba(65,95,180,.28),
            transparent 20%
        ),
        radial-gradient(
            circle at 15% 55%,
            rgba(30,80,160,.16),
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(100,30,150,.14),
            transparent 25%
        ),
        linear-gradient(
            180deg,
            #070914 0%,
            #02030a 45%,
            #000106 100%
        );
}

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:10vh;
    min-height:70px;
    max-height:100px;

    background:
        radial-gradient(
            ellipse at center top,
            rgba(100,150,255,.25),
            rgba(40,70,150,.10) 35%,
            transparent 75%
        );

    pointer-events:none;
    z-index:20;
}

#device{
    position:relative;
    min-height:100vh;
    overflow:hidden;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(130,170,255,.75) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.5) .7px,
            transparent 1px
        );

    background-size:
        150px 150px,
        230px 230px,
        90px 90px;

    background-position:
        10px 20px,
        80px 100px,
        30px 70px;
}

#device::after{
    content:"";
    position:fixed;
    inset:0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 2px
        ),
        radial-gradient(
            circle,
            rgba(120,170,255,.7) 1px,
            transparent 2px
        );

    background-size:
        310px 310px,
        410px 410px;

    animation:
        starsMove 35s linear infinite;

    pointer-events:none;
    z-index:0;
}

@keyframes starsMove{

    from{
        transform:
            translate3d(0,0,0);
    }

    to{
        transform:
            translate3d(-120px,180px,0);
    }
}

.spaceDust{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(80,120,255,.10),
            transparent 8%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(180,80,255,.08),
            transparent 10%
        ),
        radial-gradient(
            circle at 70% 80%,
            rgba(40,130,255,.08),
            transparent 12%
        );

    animation:
        dustPulse 8s ease-in-out infinite alternate;
}

@keyframes dustPulse{

    from{
        opacity:.55;
    }

    to{
        opacity:1;
    }
}

#topBar{
    position:sticky;
    top:0;
    z-index:50;
    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(10,18,42,.94),
            rgba(3,6,17,.82)
        );

    border-bottom:
        1px solid
        rgba(100,150,255,.35);

    box-shadow:
        0 0 30px
        rgba(40,90,220,.12),

        inset 0 -1px 0
        rgba(255,255,255,.05);

    backdrop-filter:
        blur(8px);
}

.logoArea{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoArea img{
    width:50px;
    height:50px;
    border-radius:12px;
    object-fit:cover;

    border:
        1px solid
        rgba(130,170,255,.55);

    box-shadow:
        0 0 15px
        rgba(70,120,255,.35);
}

.logoName{
    font-size:18px;
    font-weight:bold;
    letter-spacing:1px;

    text-shadow:
        0 0 12px
        rgba(120,170,255,.55);
}

.backButton{
    border:
        1px solid
        rgba(100,150,255,.5);

    background:
        rgba(15,25,55,.65);

    color:white;

    padding:
        10px 15px;

    border-radius:10px;

    cursor:pointer;
    text-decoration:none;
    display:inline-block;

    box-shadow:
        inset 0 0 12px
        rgba(60,100,220,.12),

        0 0 12px
        rgba(40,90,220,.12);

    transition:.25s;
}

.backButton:hover{
    background:
        rgba(40,65,120,.8);

    transform:
        translateY(-2px);
}

main{
    position:relative;
    z-index:10;
    width:100%;
    min-height:calc(100vh - 82px);

    padding:
        45px 5% 70px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(25,45,100,.12),
            transparent 60%
        );
}

.pageTitle{
    text-align:center;
    margin-bottom:40px;
}

.pageTitle h2{
    font-size:
        clamp(
            30px,
            6vw,
            48px
        );

    color:white;

    text-shadow:
        0 0 10px
        rgba(100,150,255,.55),

        0 0 25px
        rgba(60,100,220,.3);
}

.pageTitle p{
    margin-top:12px;
    color:
        rgba(220,230,255,.65);
    font-size:14px;
}

.gamesList{
    width:min(
        1100px,
        100%
    );

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:25px;
}

.gameCard{
    position:relative;
    overflow:hidden;
    border-radius:20px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(60,100,190,.18),
            transparent 45%
        ),

        linear-gradient(
            145deg,
            rgba(16,24,52,.95),
            rgba(4,7,18,.96)
        );

    border:
        1px solid
        rgba(100,150,255,.35);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.65),

        0 0 30px
        rgba(45,90,210,.12),

        inset 0 0 25px
        rgba(70,100,190,.05);

    transition:.3s;
}

.gameCard:hover{
    transform:
        translateY(-4px);

    border-color:
        rgba(130,175,255,.65);

    box-shadow:
        0 25px 60px
        rgba(0,0,0,.75),

        0 0 35px
        rgba(60,110,230,.2);
}

.gameImage{
    width:100%;
    height:250px;
    background:#ffffff;
    overflow:hidden;
}

.gameImage img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.gameInfo{
    padding:20px;
}

.gameName{
    text-align:center;
    font-size:23px;
    color:white;
    margin-bottom:17px;

    text-shadow:
        0 0 8px
        rgba(100,150,255,.3);
}

.developmentStatus{
    display:block;
    width:100%;
    padding:12px;

    text-align:center;

    color:white;

    border-radius:10px;

    background:
        rgba(15,25,55,.65);

    border:
        1px solid
        rgba(100,150,255,.5);

    box-shadow:
        inset 0 0 12px
        rgba(60,100,220,.12),

        0 0 12px
        rgba(40,90,220,.12);
}

.emptyMessage{
    display:none;
    text-align:center;
    padding:60px 20px;

    color:
        rgba(220,230,255,.6);

    font-size:16px;
}

@media(max-width:700px){

    #topBar{
        height:74px;
        padding:
            8px 12px;
    }

    .logoArea img{
        width:44px;
        height:44px;
    }

    .logoName{
        font-size:16px;
    }

    .backButton{
        padding:
            9px 12px;
        font-size:12px;
    }

    main{
        padding:
            35px 15px 60px;
    }

    .gamesList{
        grid-template-columns:1fr;
        gap:20px;
    }

    .gameImage{
        height:220px;
    }

    .gameName{
        font-size:20px;
    }
}

</style>

</head>

<body>

<div id="device">

<div class="spaceDust"></div>

<header id="topBar">

<div class="logoArea">

<img
    src="Logo studio.jpg"
    alt="Digital Studio"
>

<div class="logoName">
    Digital Studio
</div>

</div>

<a
    class="backButton"
    href="index.html"
>
    برگشت
</a>

</header>

<main>

<section class="pageTitle">

<h2>
    بازی های درحال ساخت
</h2>

<p>
    بازی های درحال توسعه توسط Digital Studio
</p>

</section>

<section
    class="gamesList"
    id="gamesList"
></section>

<div
    class="emptyMessage"
    id="emptyMessage"
>
    در حال حاضر بازی‌ای برای نمایش وجود ندارد.
</div>

</main>

</div>

<script>

const games = [

    { name:"Reality.exe", image:"All game,no aks.jpg" },

    { name:"Beyond the unknown", image:"All game,no aks.jpg" },

    { name:"Cleaning the Krusty Krab", image:"All game,no aks.jpg" },

    { name:"Poppy Playtame Chapter ?", image:"All game,no aks.jpg" },

    { name:"friend chat", image:"All game,no aks.jpg" },

    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },

    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },

    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },

    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" },
    { name:"no game", image:"no game" }

];

const gamesList =
    document.getElementById(
        "gamesList"
    );

const emptyMessage =
    document.getElementById(
        "emptyMessage"
    );

let displayedGames = 0;

games.forEach(game => {

    const image =
        String(
            game.image || ""
        ).trim();

    const name =
        String(
            game.name || ""
        ).trim();

    if(
        !image ||
        !name
    ){
        return;
    }

    if(
        name.toLowerCase() === "no game" ||
        image.toLowerCase() === "no game"
    ){
        return;
    }

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "gameCard";

    card.innerHTML = `

        <div class="gameImage">

            <img
                src="${image}"
                alt="${name}"
            >

        </div>

        <div class="gameInfo">

            <h3 class="gameName">
                ${name}
            </h3>

            <div class="developmentStatus">
                درحال ساخت
            </div>

        </div>

    `;

    gamesList.appendChild(card);

    displayedGames++;

});

if(
    displayedGames === 0
){
    emptyMessage.style.display =
        "block";
}

</script>

<script src="VisitorSystem.js"></script>
<script>
sendPageVisit("بازی های درحال ساخت");
</script>

</body>

</html>
