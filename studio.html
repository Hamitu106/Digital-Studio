<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<title>اخبار | Digital Studio</title>


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color:white;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,110,255,.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(80,0,255,.22),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #02030a,
            #050b20 50%,
            #010207
        );
}


/* ستاره های فضا */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(100,180,255,.7) 1px,
            transparent 1px
        );

    background-size:
        90px 90px,
        140px 140px;

    background-position:
        10px 20px,
        50px 80px;

    opacity:.35;

    z-index:0;
}


.space-glow{

    position:fixed;

    width:500px;

    height:500px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,120,255,.16),
            transparent 65%
        );

    top:30%;

    left:50%;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    z-index:0;
}


/* بالای صفحه */

header{

    position:relative;

    z-index:2;

    width:100%;

    padding:20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    border-bottom:
        1px solid
        rgba(80,160,255,.25);

    background:
        rgba(0,0,10,.65);

    backdrop-filter:
        blur(10px);
}


.logo-area{

    display:flex;

    align-items:center;

    gap:12px;
}


.logo{

    width:52px;

    height:52px;

    border-radius:50%;

    object-fit:cover;

    border:
        2px solid
        #4da3ff;

    box-shadow:
        0 0 12px
        rgba(0,140,255,.7);
}


.page-title{

    margin:0;

    font-size:26px;

    color:white;

    text-shadow:
        0 0 12px
        rgba(80,170,255,.8);
}


.back-button{

    border:
        1px solid
        #397dff;

    background:
        rgba(10,35,80,.75);

    color:white;

    padding:
        10px 17px;

    border-radius:10px;

    text-decoration:none;

    transition:.2s;
}


.back-button:hover{

    background:
        rgba(25,75,150,.9);

    box-shadow:
        0 0 18px
        rgba(0,140,255,.55);

    transform:
        translateY(-2px);
}


/* محتوای اخبار */

main{

    position:relative;

    z-index:1;

    width:min(1100px,92%);

    margin:
        40px auto 70px;
}


.section-title{

    text-align:center;

    margin:
        0 0 35px;

    color:#69b7ff;

    font-size:32px;

    text-shadow:
        0 0 10px
        rgba(0,130,255,.8);
}


#newsList{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:25px;
}


/* کارت خبر */

.news-card{

    position:relative;

    overflow:hidden;

    border:
        1px solid
        rgba(70,150,255,.55);

    border-radius:18px;

    padding:24px;

    background:
        linear-gradient(
            145deg,
            rgba(8,25,55,.92),
            rgba(3,7,22,.94)
        );

    box-shadow:
        0 0 18px
        rgba(0,100,255,.14);

    transition:.25s;
}


.news-card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(90,180,255,.9);

    box-shadow:
        0 0 25px
        rgba(0,120,255,.3);
}


.news-card.has-link{

    cursor:pointer;
}


.news-name{

    margin:
        0 0 14px;

    font-size:22px;

    color:#8bc7ff;

    text-shadow:
        0 0 8px
        rgba(70,160,255,.4);
}


.news-text{

    margin:0;

    line-height:2;

    color:#e7f2ff;

    font-size:16px;

    white-space:pre-wrap;
}


.news-date{

    margin-top:20px;

    padding-top:13px;

    border-top:
        1px solid
        rgba(100,160,255,.18);

    color:#8da7c7;

    font-size:13px;
}


.news-link{

    display:inline-block;

    margin-top:14px;

    color:#61b5ff;

    font-size:13px;

    text-decoration:none;
}


.news-link:hover{

    text-decoration:underline;
}


.empty-news{

    grid-column:
        1 / -1;

    text-align:center;

    padding:50px 20px;

    color:#8da7c7;

    border:
        1px dashed
        rgba(80,150,255,.35);

    border-radius:18px;

    background:
        rgba(5,15,35,.5);
}


/* موبایل */

@media(max-width:700px){

    header{

        padding:15px;
    }

    .page-title{

        font-size:21px;
    }

    .logo{

        width:44px;

        height:44px;
    }

    #newsList{

        grid-template-columns:1fr;
    }

    .section-title{

        font-size:27px;
    }

    .news-card{

        padding:20px;
    }
}

</style>

خبر نمایش داده نمی‌شود.

Link اختیاری است.

==========================================================
*/


const validNews = allNews.filter(news => {

    return (

        news &&

        typeof news["News name"] === "string" &&
        news["News name"].trim() !== "" &&

        typeof news["News"] === "string" &&
        news["News"].trim() !== "" &&

        typeof news["Data"] === "string" &&
        news["Data"].trim() !== ""

    );

});


/*
==========================================================
ترتیب نمایش

خبرهایی که پایین‌تر در کد هستند،
بالاتر در صفحه نمایش داده می‌شوند.

مثلاً:

news50
news49
news48
...
news2
news1

==========================================================
*/


const newsList =
    document.getElementById("newsList");


for(
    let i = validNews.length - 1;
    i >= 0;
    i--
){

    const news =
        validNews[i];


    const card =
        document.createElement("article");

    card.className =
        "news-card";


    const title =
        document.createElement("h3");

    title.className =
        "news-name";

    title.textContent =
        news["News name"];


    const text =
        document.createElement("p");

    text.className =
        "news-text";

    text.textContent =
        news["News"];


    const date =
        document.createElement("div");

    date.className =
        "news-date";

    date.textContent =
        "تاریخ: " + news["Data"];


    card.appendChild(title);

    card.appendChild(text);

    card.appendChild(date);


    /*
    Link اختیاری
    */

    if(

        typeof news["Link"] === "string" &&

        news["Link"].trim() !== ""

    ){

        card.classList.add("has-link");


        const link =
            document.createElement("a");


        link.className =
            "news-link";


        link.href =
            news["Link"];


        link.target =
            "_blank";


        link.rel =
            "noopener noreferrer";


        link.textContent =
            "مشاهده لینک";


        card.appendChild(link);


        card.addEventListener(
            "click",
            event => {

                if(
                    event.target !== link
                ){

                    window.open(
                        news["Link"],
                        "_blank",
                        "noopener,noreferrer"
                    );

                }

            }
        );

    }


    newsList.appendChild(card);

}


/*

if(
