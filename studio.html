<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اخبار استودیو | Digital Studio</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    color:white;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 50% 0%, rgba(100,150,255,.18), transparent 35%),
        radial-gradient(circle at 0% 50%, rgba(30,70,150,.12), transparent 40%),
        radial-gradient(circle at 100% 50%, rgba(30,70,150,.12), transparent 40%),
        linear-gradient(180deg,#02040a 0%,#050914 50%,#02040a 100%);
}

/* نور بالای صفحه */
body::before{
    content:"";
    position:fixed;
    top:10vh;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    min-height:70px;
    max-height:100px;
    pointer-events:none;

    background:radial-gradient(
        ellipse at center,
        rgba(100,150,255,.25),
        rgba(40,70,150,.10) 35%,
        transparent 75%
    );

    z-index:0;
}

/* ستاره ها */
body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
        radial-gradient(circle,rgba(120,170,255,.5) 1px,transparent 1px);

    background-size:
        95px 95px,
        145px 145px;

    background-position:
        10px 20px,
        50px 80px;

    opacity:.25;
    z-index:0;
}

/* نوار بالا */
#topBar{
    position:sticky;
    top:0;
    z-index:20;

    height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:
        linear-gradient(
            180deg,
            rgba(8,14,32,.96),
            rgba(5,9,22,.92)
        );

    border-bottom:1px solid rgba(100,150,255,.35);

    box-shadow:
        0 4px 25px rgba(30,80,200,.18),
        inset 0 -1px 8px rgba(80,130,255,.08);
}

.logo{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:12px;

    box-shadow:
        0 0 15px rgba(80,130,255,.25);
}

/* دکمه برگشت */
.backButton{
    border:1px solid rgba(100,150,255,.5);

    background:rgba(15,25,55,.65);

    color:white;

    padding:10px 15px;

    border-radius:10px;

    cursor:pointer;
    text-decoration:none;

    box-shadow:
        inset 0 0 12px rgba(60,100,220,.12),
        0 0 12px rgba(40,90,220,.12);

    transition:.25s;
}

.backButton:hover{
    background:rgba(40,65,120,.8);
    transform:translateY(-2px);
}

/* عنوان */
.pageTitle{
    position:relative;
    z-index:2;

    text-align:center;

    margin:45px 20px 30px;

    font-size:32px;
    font-weight:bold;

    text-shadow:
        0 0 10px rgba(100,150,255,.5),
        0 0 25px rgba(50,100,220,.25);
}

/* لیست خبرها */
#newsList{
    position:relative;
    z-index:2;

    width:min(1100px,92%);

    margin:0 auto 60px;

    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:20px;
}

/* کارت خبر */
.newsCard{
    position:relative;

    padding:22px;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(15,25,55,.88),
            rgba(4,8,20,.92)
        );

    border:1px solid rgba(100,150,255,.28);

    box-shadow:
        inset 0 0 20px rgba(50,90,180,.08),
        0 0 18px rgba(20,60,150,.12);

    transition:.25s;

    overflow:hidden;
}

.newsCard::before{
    content:"";

    position:absolute;
    top:-50px;
    left:50%;
    transform:translateX(-50%);

    width:80%;
    height:80px;

    background:radial-gradient(
        ellipse,
        rgba(100,150,255,.12),
        transparent 70%
    );

    pointer-events:none;
}

.newsCard:hover{
    transform:translateY(-4px);

    border-color:rgba(100,150,255,.55);

    box-shadow:
        inset 0 0 25px rgba(50,90,180,.12),
        0 0 25px rgba(30,80,200,.2);
}

.newsName{
    position:relative;

    font-size:21px;
    font-weight:bold;

    margin-bottom:15px;

    color:#dce8ff;
}

.newsText{
    position:relative;

    line-height:1.9;

    color:#e8edf8;

    margin-bottom:15px;
}

.newsData{
    position:relative;

    color:#91b7ff;

    font-size:14px;
}

.newsLink{
    position:relative;

    display:inline-block;

    margin-top:15px;

    padding:8px 13px;

    border-radius:9px;

    color:white;
    text-decoration:none;

    background:rgba(15,30,70,.7);

    border:1px solid rgba(100,150,255,.4);

    transition:.2s;
}

.newsLink:hover{
    background:rgba(40,70,130,.8);
}

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:50px 20px;

    color:#9daac5;

    border:1px solid rgba(100,150,255,.18);

    border-radius:15px;

    background:rgba(8,14,30,.65);
}

/* موبایل */
@media(max-width:700px){

    #topBar{
        height:75px;
        padding:0 14px;
    }

    .logo{
        width:48px;
        height:48px;
    }

    .pageTitle{
        font-size:26px;
        margin-top:35px;
    }

    #newsList{
        grid-template-columns:1fr;
        width:92%;
    }

    .newsCard{
        padding:18px;
    }
}
</style>
</head>
