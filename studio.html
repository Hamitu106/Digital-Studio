<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اخبار استودیو | Digital Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#02030a;
    color:white;
    font-family:Arial,Tahoma,sans-serif;
    overflow-x:hidden;
}

/* =========================
   SPACE BACKGROUND
========================= */

body{
    background:
        radial-gradient(circle at 50% 8%,rgba(65,95,180,.28),transparent 20%),
        radial-gradient(circle at 15% 55%,rgba(30,80,160,.16),transparent 25%),
        radial-gradient(circle at 85% 75%,rgba(100,30,150,.14),transparent 25%),
        linear-gradient(180deg,#070914 0%,#02030a 45%,#000106 100%);
}

/* =========================
   TOP LIGHT
========================= */

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:10vh;
    min-height:70px;
    max-height:100px;

    background:
        radial-gradient(
            ellipse at center top,
            rgba(100,150,255,.25),
            rgba(40,70,150,.10) 35%,
            transparent 75%
        );

    pointer-events:none;
    z-index:20;
}

/* =========================
   STARS
========================= */

#device{
    position:relative;
    min-height:100vh;
    overflow:hidden;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.5px),
        radial-gradient(circle,rgba(130,170,255,.75) 1px,transparent 1.5px),
        radial-gradient(circle,rgba(255,255,255,.5) .7px,transparent 1px);

    background-size:
        150px 150px,
        230px 230px,
        90px 90px;

    background-position:
        10px 20px,
        80px 100px,
        30px 70px;
}

#device::after{
    content:"";
    position:fixed;
    inset:0;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 2px),
        radial-gradient(circle,rgba(120,170,255,.7) 1px,transparent 2px);

    background-size:310px 310px,410px 410px;

    animation:starsMove 35s linear infinite;

    pointer-events:none;
    z-index:0;
}

@keyframes starsMove{
    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(-120px,180px,0);
    }
}

/* =========================
   SPACE DUST
========================= */

.spaceDust{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;

    background:
        radial-gradient(circle at 20% 30%,rgba(80,120,255,.10),transparent 8%),
        radial-gradient(circle at 80% 20%,rgba(180,80,255,.08),transparent 10%),
        radial-gradient(circle at 70% 80%,rgba(40,130,255,.08),transparent 12%);

    animation:dustPulse 8s ease-in-out infinite alternate;
}

@keyframes dustPulse{
    from{opacity:.55;}
    to{opacity:1;}
}

/* =========================
   TOP BAR
========================= */

#topBar{
    position:sticky;
    top:0;
    z-index:50;

    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(10,18,42,.94),
            rgba(3,6,17,.82)
        );

    border-bottom:1px solid rgba(100,150,255,.35);

    box-shadow:
        0 0 30px rgba(40,90,220,.12),
        inset 0 -1px 0 rgba(255,255,255,.05);

    backdrop-filter:blur(8px);
}

.logoArea{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoArea img{
    width:50px;
    height:50px;
    border-radius:12px;
    object-fit:cover;

    border:1px solid rgba(130,170,255,.55);

    box-shadow:
        0 0 15px rgba(70,120,255,.35);
}

.logoName{
    font-size:18px;
    font-weight:bold;
    letter-spacing:1px;

    text-shadow:
        0 0 12px rgba(120,170,255,.55);
}

/* =========================
   BACK BUTTON
========================= */

.backButton{
    border:1px solid rgba(100,150,255,.5);
    background:rgba(15,25,55,.65);
    color:white;

    padding:10px 15px;
    border-radius:10px;

    cursor:pointer;
    text-decoration:none;

    box-shadow:
        inset 0 0 12px rgba(60,100,220,.12),
        0 0 12px rgba(40,90,220,.12);

    transition:.25s;
}

.backButton:hover{
    background:rgba(40,65,120,.8);
    transform:translateY(-2px);
}

/* =========================
   PAGE
========================= */

#newsPage{
    position:relative;
    z-index:10;

    min-height:calc(100vh - 82px);

    padding:35px 20px 80px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(25,45,100,.12),
            transparent 60%
        );
}

/* =========================
   TITLE
========================= */

.pageTitle{
    text-align:center;

    font-size:32px;
    font-weight:bold;

    margin:15px 0 35px;

    text-shadow:
        0 0 12px rgba(120,170,255,.55),
        0 0 28px rgba(60,100,255,.25);
}

/* =========================
   NEWS GRID
========================= */

#newsList{
    width:min(1000px,92vw);

    margin:auto;

    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));

    gap:22px;
}

/* =========================
   NEWS CARD
========================= */

.newsCard{
    position:relative;

    min-height:210px;

    padding:25px;

    border-radius:26px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(60,100,190,.22),
            transparent 45%
        ),
        linear-gradient(
            145deg,
            rgba(16,24,52,.95),
            rgba(4,7,18,.96)
        );

    border:1px solid rgba(100,150,255,.35);

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 35px rgba(45,90,210,.13),
        inset 0 0 30px rgba(70,100,190,.07);

    overflow:hidden;

    transition:.3s;
}

.newsCard:hover{
    transform:translateY(-5px);

    border-color:rgba(150,190,255,.65);

    box-shadow:
        0 25px 70px rgba(0,0,0,.65),
        0 0 35px rgba(60,120,255,.22),
        inset 0 0 30px rgba(70,100,190,.10);
}

/* گوشه‌های پنل */

.newsCard::before,
.newsCard::after{
    content:"";
    position:absolute;

    width:55px;
    height:55px;

    border-color:rgba(110,160,255,.4);
    border-style:solid;

    pointer-events:none;
}

.newsCard::before{
    top:12px;
    left:12px;

    border-width:1px 0 0 1px;
}

.newsCard::after{
    bottom:12px;
    right:12px;

    border-width:0 1px 1px 0;
}

/* نور کارت */

.newsLight{
    position:absolute;

    top:-65px;
    left:50%;

    width:220px;
    height:120px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(80,140,255,.22),
            transparent 70%
        );

    filter:blur(10px);

    pointer-events:none;
}

/* نام خبر */

.newsName{
    position:relative;
    z-index:2;

    font-size:21px;
    font-weight:bold;

    margin-bottom:17px;

    color:white;

    text-shadow:
        0 0 10px rgba(100,150,255,.35);
}

/* متن */

.newsText{
    position:relative;
    z-index:2;

    color:rgba(225,232,250,.82);

    font-size:14px;

    line-height:2;

    margin-bottom:18px;
}

/* تاریخ */

.newsData{
    position:relative;
    z-index:2;

    color:rgba(140,180,255,.75);

    font-size:12px;
}

/* لینک */

.newsLink{
    position:relative;
    z-index:3;

    display:inline-block;

    margin-top:18px;

    padding:9px 14px;

    border-radius:10px;

    border:1px solid rgba(100,150,255,.45);

    background:rgba(15,25,55,.65);

    color:white;

    text-decoration:none;

    box-shadow:
        0 0 12px rgba(40,90,220,.10);

    transition:.25s;
}

.newsLink:hover{
    background:rgba(40,65,120,.8);
    transform:translateY(-2px);
}

/* =========================
   EMPTY
========================= */

.emptyNews{
    grid-column:1 / -1;

    text-align:center;

    padding:60px 20px;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(16,24,52,.9),
            rgba(4,7,18,.95)
        );

    border:1px solid rgba(100,150,255,.3);

    color:rgba(220,230,255,.65);

    box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        0 0 30px rgba(45,90,210,.10);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #topBar{
        height:74px;
        padding:8px 12px;
    }

    .logoArea img{
        width:44px;
        height:44px;
    }

    .logoName{
        font-size:16px;
    }

    .backButton{
        padding:9px 12px;
        font-size:12px;
    }

    #newsPage{
        padding:30px 12px 60px;
    }

    .pageTitle{
        font-size:26px;
        margin-bottom:28px;
    }

    #newsList{
        width:94vw;
        grid-template-columns:1fr;
        gap:18px;
    }

    .newsCard{
        min-height:190px;
        padding:22px 18px;
    }

    .newsName{
        font-size:19px;
    }
}
</style>
