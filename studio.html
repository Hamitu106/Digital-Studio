    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, #202020 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, #151515 0%, transparent 30%),
                #000000;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
        }

        .top-bar {
            width: 100%;
            min-height: 70px;
            background: #080808;
            border-bottom: 1px solid #252525;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 12px;
        }

        .back-button {
            position: absolute;
            right: 15px;

            background: #151515;
            color: white;

            border: 1px solid #444;
            border-radius: 8px;

            padding: 10px 18px;

            font-size: 15px;
            cursor: pointer;

            transition: 0.2s;
        }

        .back-button:hover {
            background: #252525;
        }

        .section-title {
            font-size: 27px;
            font-weight: bold;
        }

        .all-news-title {
            text-align: center;

            margin-top: 35px;
            margin-bottom: 25px;

            font-size: 24px;
        }

        #newsList {
            width: 92%;
            max-width: 1100px;

            margin: auto;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 20px;

            padding-bottom: 40px;
        }

        .news-card {
            background: #090909;

            border: 1px solid #333;
            border-radius: 12px;

            padding: 20px;

            min-height: 150px;

            box-shadow: 0 0 15px rgba(255, 255, 255, 0.03);
        }

        .news-name {
            font-size: 20px;
            font-weight: bold;

            margin-bottom: 8px;

            color: #ffffff;
        }

        .news-date {
            font-size: 13px;

            color: #888;

            margin-bottom: 15px;
        }

        .news-content {
            font-size: 16px;
            line-height: 2;

            color: #d0d0d0;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .empty-message {
            grid-column: 1 / -1;

            text-align: center;

            color: #777;

            font-size: 18px;

            padding: 40px 10px;
        }

        @media (max-width: 700px) {

            #newsList {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 23px;
            }

            .all-news-title {
                font-size: 21px;
            }

            .back-button {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
