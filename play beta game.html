<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود بازی های بتا | Digital Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #1e73d8;
            font-family: Arial, Tahoma, sans-serif;
            color: white;
            min-height: 100vh;
        }

        /* نوار بالای صفحه */
        .top-bar {
            height: 80px;
            background: #f1c40f;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 20px;
        }

        .back-button {
            background: #8b5a2b;
            color: white;
            border: none;
            padding: 12px 22px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        .back-button:hover {
            background: #70461f;
        }

        .section-title {
            background: #55b9b9;
            color: white;
            padding: 12px 25px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 4px;
        }

        /* محتوای صفحه */
        .page {
            width: 100%;
            padding: 25px;
        }

        .all-games-title {
            background: #f1c40f;
            color: #111;
            width: fit-content;
            padding: 12px 30px;
            margin: 0 auto 25px auto;
            font-size: 25px;
            font-weight: bold;
            border-radius: 4px;
        }

        /* لیست بازی‌ها */
        #gamesList {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: auto;
        }

        /* کارت هر بازی */
        .game-card {
            background: #050505;
            min-height: 180px;
            display: flex;
            align-items: stretch;
            border: 4px solid #f1c40f;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .game-card:hover {
            transform: scale(1.02);
        }

        /* اطلاعات بازی */
        .game-info {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-name {
            color: white;
            font-size: 21px;
            font-weight: bold;
            text-align: center;
        }

        /* عکس بازی */
        .game-image-box {
            width: 150px;
            min-width: 150px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: ltr;
        }

        .game-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* اگر بازی وجود نداشت */
        .empty-message {
            background: #000;
            border: 4px solid #f1c40f;
            padding: 30px;
            text-align: center;
            font-size: 20px;
            max-width: 700px;
            margin: 40px auto;
        }

        /* موبایل */
        @media (max-width: 700px) {
            #gamesList {
                grid-template-columns: 1fr;
            }

            .game-card {
                min-height: 150px;
            }

            .game-image-box {
                width: 120px;
                min-width: 120px;
            }

            .section-title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- نوار بالای صفحه -->
    <header class="top-bar">

        <button class="back-button" id="backButton">
            بازگشت
        </button>

        <div class="section-title">
            دانلود بازی های بتا
        </div>

    </header>

    <main class="page">

        <div class="all-games-title">
            تمام بازی‌ها
        </div>

        <!-- سیستم بازی‌ها کارت‌ها را اینجا قرار می‌دهد -->
        <section id="gamesList"></section>

    </main>

    <script>

        /*
        ==========================================================
        سیستم اطلاعات بازی‌ها
        ==========================================================

        برای هر بازی فقط این سه اطلاعات را تعیین کن:

        name  = اسم بازی
        image = اسم فایل عکس بازی
        url   = آدرسی که با کلیک روی بازی باز می‌شود

        اگر هر سه اطلاعات وجود داشته باشند،
        بازی وارد لیست می‌شود.

        اگر حتی یکی از آنها no game باشد،
        بازی نمایش داده نمی‌شود.

        فعلاً 25 جای بازی داریم.
        ==========================================================
        */

        const games = [

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            },

            {
                name: "no game",
                image: "no game",
                url: "no game"
            }

        ];

        /*
        ==========================================================
        بررسی اطلاعات و ساخت لیست
        ==========================================================
        */

        const gamesList = document.getElementById("gamesList");

        let addedGames = 0;

        games.forEach(function(game) {

            if (
                !game.name ||
                !game.image ||
                !game.url ||
                game.name.toLowerCase() === "no game" ||
                game.image.toLowerCase() === "no game" ||
                game.url.toLowerCase() === "no game"
            ) {
                return;
            }

            /* ساخت کارت بازی */
            const card = document.createElement("article");
            card.className = "game-card";

            /* بخش اسم بازی */
            const info = document.createElement("div");
            info.className = "game-info";

            const name = document.createElement("div");
            name.className = "game-name";

            name.textContent = game.name;

            info.appendChild(name);

            /* بخش عکس */
            const imageBox = document.createElement("div");
            imageBox.className = "game-image-box";

            const image = document.createElement("img");
            image.className = "game-image";

            image.src = game.image;
            image.alt = game.name;

            imageBox.appendChild(image);

            /* اضافه کردن قسمت‌ها به کارت */
            card.appendChild(info);
            card.appendChild(imageBox);

            /* کلیک روی بازی */
            card.addEventListener("click", function() {
                window.location.href = game.url;
            });

            /* اضافه کردن کارت به لیست */
            gamesList.appendChild(card);

            addedGames++;
        });

        /*
        اگر هیچ بازی کاملی وجود نداشت،
        پیام مخصوص نمایش داده می‌شود.
        */

        if (addedGames === 0) {

            gamesList.innerHTML = `
                <div class="empty-message">
                    هنوز بازی‌ای برای نمایش وجود ندارد.
                </div>
            `;

        }

        /*
        ==========================================================
        دکمه بازگشت به منوی اصلی
        ==========================================================
        */

        document.getElementById("backButton").addEventListener(
            "click",
            function() {
                window.location.href = "index.html";
            }
        );

    </script>

</body>
</html>
